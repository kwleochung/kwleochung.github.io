<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>던롭필로 매트리스 맞춤 추천 키오스크</title>
  <!-- 태블릿 키오스크 모드용: 홈 화면에 추가 시 크롬 주소창/탭 없이 실행되도록 하는 웹앱 매니페스트 -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1b2f6b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    /* Dunlopillo Brand Guidelines v1.0 기준 컬러 시스템 */
    :root {
      --primary: #1b2f6b;      /* Dunlopillo Blue */
      --primary-light: #12969f; /* Secondary - Teal accent */
      --error: #a91e30;         /* Secondary - Terracotta Red */
      --bg-gray: #fff9f0;       /* Secondary - Ivory */
      --card-border: #ece2d0;
      --text-main: #191919;
      --text-sub: #6b6152;
      --tan: #fdefd5;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      background-color: var(--primary);
      color: var(--text-main);
      user-select: none;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
    }
    #kiosk-container {
      width: 100%;
      max-width: 1280px;
      height: 100vh;
      height: 100dvh;
      max-height: 800px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }
    header {
      padding: 20px 40px;
      background: var(--primary);
      display: flex;
      justify-content: flex-start;
      align-items: center;
      flex-shrink: 0;
    }
    .brand-logo { height: 34px; display: block; }
    .nav-btn {
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 600;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      background: #fff;
      color: var(--text-main);
      cursor: pointer;
    }
    .progress-bar {
      height: 6px;
      background: var(--tan);
      width: 100%;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary-light);
      width: 0%;
      transition: width 0.3s ease;
    }
    main {
      flex: 1;
      padding: 28px 56px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow-y: auto;
    }
    .step-title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .step-desc {
      font-size: 15px;
      color: var(--text-sub);
      margin-bottom: 24px;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .btn-grid.single-col { grid-template-columns: 1fr; }
    .btn-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .option-btn {
      padding: 20px;
      background: #fff;
      border: 2px solid var(--card-border);
      border-radius: 12px;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: border-color 0.2s, background-color 0.2s;
    }
    .option-btn:active {
      border-color: var(--primary-light);
      background-color: #f2f9f9;
    }
    .option-btn.selected {
      border-color: var(--primary);
      background-color: #eef1f8;
      box-shadow: inset 0 0 0 1px var(--primary);
    }
    .option-label { font-size: 19px; font-weight: 600; margin-bottom: 6px; }
    .option-sub { font-size: 13px; color: var(--text-sub); }
    .step-nav {
      display: flex;
      gap: 12px;
      margin-top: 4px;
      justify-content: space-between;
    }
    .btn-next {
      flex: 0 0 140px;
      text-align: center;
      background: var(--primary);
      color: #fff;
      border: none;
    }
    .btn-next[disabled] {
      opacity: 0.4;
      pointer-events: none;
    }
    .btn-prev {
      flex: 0 0 140px;
      text-align: center;
    }
    .result-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .result-card {
      border: 2px solid var(--primary-light);
      border-radius: 14px;
      padding: 24px;
      background: #ffffff;
      position: relative;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      background: var(--primary);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      border-radius: 4px;
      margin-bottom: 10px;
    }
    .prod-name { font-size: 24px; font-weight: 700; margin: 4px 0 10px 0; }
    .prod-image-placeholder {
      width: 100%;
      height: 150px;
      background: var(--bg-gray);
      border-radius: 10px;
      margin-bottom: 14px;
    }
    .prod-desc { font-size: 15px; color: var(--text-sub); line-height: 1.5; margin-bottom: 14px; }
    .prod-specs { font-size: 13px; color: var(--text-sub); }
    .result-actions {
      display: flex;
      gap: 12px;
      margin-top: 28px;
    }
    .result-actions .option-btn { flex: 1; text-align: center; }
    .kakao-btn {
      background: #FEE500;
      border-color: #FEE500;
      color: #181600;
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-box {
      background: #fff;
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 420px;
    }
    .phone-input {
      width: 100%;
      padding: 16px;
      font-size: 22px;
      border: 2px solid var(--card-border);
      border-radius: 10px;
      text-align: center;
      letter-spacing: 1px;
    }
    .phone-input:focus { outline: none; border-color: var(--primary-light); }
    .consent-text { font-size: 12px; color: #94a3b8; margin-top: 10px; line-height: 1.5; }
    .modal-status { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 16px 0; }
    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid var(--card-border);
      border-top-color: var(--primary-light);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

// 키오스크 앱 컨트롤러
class KioskApp {
  constructor() {
    this.view = document.getElementById("app-view");
    this.progress = document.getElementById("progress");
    this.timer = null;
    this.idleTime = 0;
    this.state = this.initialState();
    this.initIdleTimer();
    this.render();
  }

  initialState() {
    return {
      step: 0,
      flow: null, // 'mattress' | 'pillow'
      // 매트리스 설문
      gender: null,
      age: null,
      size: null,
      bodyType: null,
      posture: null,
      firmness: null,
      concern: null,
      // 베개 설문
      currentMattressFeel: null,
      neckConcern: null,
      pillowSupport: null,
      // 공통
      phone: "",
      showPhoneModal: false,
      submitState: null,
      searching: false
    };
  }

  startFlow(flow) {
    this.state.flow = flow;
    this.state.step = 1;
    this.render();
  }

  // 옵션 버튼 하나를 생성. 현재 답변과 일치하면 선택 표시가 붙는다.
  optBtn(key, value, label, sub, extraStyle) {
    const selected = this.state[key] === value;
    const style = extraStyle ? ` style="${extraStyle}"` : "";
    return `
      <button class="option-btn${selected ? " selected" : ""}"${style} onclick="app.selectOption('${key}', '${value}')">
        <div class="option-label"${sub ? "" : ' style="margin:0;"'}>${label}</div>
        ${sub ? `<div class="option-sub">${sub}</div>` : ""}
      </button>
    `;
  }

  // 각 질문 하단의 이전/다음 버튼. 답변이 없으면 다음 버튼은 비활성화.
  stepNav(key) {
    const hasValue = this.state[key] !== null && this.state[key] !== undefined;
    return `
      <div class="step-nav">
        <button class="option-btn btn-prev" onclick="app.goBack()">
          <div class="option-label" style="margin:0;">이전으로</div>
        </button>
        <button class="option-btn btn-next" ${hasValue ? "" : "disabled"} onclick="app.goNext()">
          <div class="option-label" style="margin:0;">다음</div>
        </button>
      </div>
    `;
  }

  selectOption(key, value) {
    this.state[key] = value;
    this.render();
  }

  goBack() {
    this.state.step = Math.max(0, this.state.step - 1);
    this.render();
  }

  goNext() {
    const lastQuestionStep = this.state.flow === "pillow" ? 4 : 7;
    this.state.step++;
    if (this.state.step === lastQuestionStep + 1) {
      // 마지막 질문 직후: 결과를 바로 보여주지 않고 검색 중 화면을 잠시 보여준다.
      this.state.searching = true;
      this.render();
      setTimeout(() => {
        this.state.searching = false;
        this.render();
        // 전화번호 입력 여부와 무관하게 설문 완료 시점에 구글 시트로 기록
        this.sendToBackend(this.buildSurveyPayload(""));
      }, 3000);
    } else {
      this.render();
    }
  }

  renderSearching() {
    this.setProgress(100);
    this.view.innerHTML = `
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;">
        <div class="spinner" style="width:56px; height:56px; border-width:5px; margin-bottom:24px;"></div>
        <div style="font-size:20px; font-weight:700; line-height:1.6;">ChatDunlop이 고객님에게<br />추천할 모델을 검색중입니다</div>
      </div>
    `;
  }

  completeSurvey() {
    const root = document.getElementById("modal-root");
    root.innerHTML = `
      <div class="modal-overlay">
        <div class="modal-box" style="text-align:center;">
          <div style="font-size:19px; font-weight:700;">참여해주셔서 감사합니다</div>
        </div>
      </div>
    `;
    setTimeout(() => { this.reset(); }, 2000);
  }

  initIdleTimer() {
    const resetTimer = () => { this.idleTime = 0; };
    window.onload = resetTimer;
    document.onmousemove = resetTimer;
    document.onmousedown = resetTimer;
    document.ontouchstart = resetTimer;
    document.onclick = resetTimer;
    document.onkeypress = resetTimer;

    setInterval(() => {
      this.idleTime++;
      // 60초간 터치 없으면 홈 화면으로 복귀
      if (this.idleTime >= 60 && this.state.step > 0) {
        this.reset();
      }
    }, 1000);
  }

  reset() {
    this.state = this.initialState();
    this.render();
  }

  setProgress(pct) {
    this.progress.style.width = pct + "%";
  }

  render() {
    if (this.state.step === 0) {
      this.renderHome();
    } else if (this.state.flow === "pillow") {
      switch (this.state.step) {
        case 1: this.renderPillowStepPosture(); break;
        case 2: this.renderPillowStepMattressFeel(); break;
        case 3: this.renderPillowStepNeckConcern(); break;
        case 4: this.renderPillowStepSupport(); break;
        case 5: this.state.searching ? this.renderSearching() : this.renderPillowResult(); break;
      }
    } else {
      switch (this.state.step) {
        case 1: this.renderStepGender(); break;
        case 2: this.renderStepAge(); break;
        case 3: this.renderStepSize(); break;
        case 4: this.renderStepBodyType(); break;
        case 5: this.renderStepPosture(); break;
        case 6: this.renderStepFirmness(); break;
        case 7: this.renderStepConcern(); break;
        case 8: this.state.searching ? this.renderSearching() : this.renderResult(); break;
      }
    }
    this.renderModal();
  }

      <div class="step-desc">마지막 질문이에요. 원하는 탄성감을 선택해 주세요.</div>
      <div class="btn-grid">
        ${this.optBtn("pillowSupport", "HIGH_RESILIENCE", "탄탄하게 튕겨내는 고탄성")}
        ${this.optBtn("pillowSupport", "MEDIUM_RESILIENCE", "쫀득하고 찰진 미디엄 탄성")}
        ${this.optBtn("pillowSupport", "LOW_RESILIENCE", "말랑말랑하고 포근한 저탄성")}
        ${this.optBtn("pillowSupport", "CONTOUR_FREEFORM", "자유롭게 만져지는 입체형 쿠션감")}
      </div>
      ${this.stepNav("pillowSupport")}
    `;
  }

  // 추천 결정 로직 - 던롭필로 실제 매트리스 강도 가이드(7단계) 기준으로 확정된 고정 매핑.
  // 성별/연령대/사이즈/체형/자세/수면고민 답변은 구글 시트에는 계속 기록되지만(고객 프로파일링용),
  // 실제 어떤 모델을 추천할지는 이 가이드에 명시된 "경도" 하나로만 결정한다.
  // (체형·자세별 매트리스 매핑 자료가 아직 없어 경도 외 기준은 반영할 실제 데이터가 없음)
  getRecommendations() {
    const ids = MATTRESS_RECOMMENDATIONS[this.state.firmness] || [];
    return ids.map(id => MATTRESS_CATALOG.find(m => m.id === id)).filter(Boolean);
  }

  renderResult() {
    this.setProgress(100);
    const results = this.getRecommendations();

    const cardsHtml = results.map((item, idx) => `
      <div class="result-card">
        <span class="badge">${idx === 0 ? "추천 모델1" : "추천 모델2"}</span>
        <div class="prod-name">${item.name}</div>
        <div class="prod-image-placeholder"></div>
        <div class="prod-desc">${item.desc}</div>
        <div class="prod-specs">라인: ${item.line} | 경도: ${item.firmness} | 제작 가능 사이즈: ${item.sizes.join(", ")}</div>
      </div>
    `).join("");

    this.view.innerHTML = `
      <div class="step-title">고객님을 위한 매트리스 추천 결과</div>
      <div class="step-desc">매장 내 체험존 위치를 확인하시고 직접 누워보며 지지력을 체감해 보세요.</div>
      <div class="result-list">${cardsHtml}</div>
      <div class="result-actions">
        <button class="option-btn kakao-btn" onclick="app.openPhoneModal()">
          <div class="option-label" style="margin:0;">카카오톡으로 결과 받기</div>
        </button>
        <button class="option-btn" style="background:var(--primary); color:#fff; border:none;" onclick="app.completeSurvey()">
          <div class="option-label" style="margin:0;">설문 완료</div>
        </button>
      </div>
    `;
  }

  // 추천 결정 로직 - 던롭필로 실제 베개 선택 가이드(수면자세 × 체형별 매핑) 기준.
  // 가이드의 1차 기준은 "수면자세 × 체격 크기"인데, 지금 베개 설문에는 체격 크기 질문이 없어
  // "보통 체격" 기준값을 기본으로 사용하고, 경추고민/지지감 답변으로 그 안에서 한 번 더 조정한다.
  // 매트리스 느낌(currentMattressFeel) 답변은 참고용으로 구글 시트에는 기록되지만 추천에는 반영할 실제 데이터가 없다.
  getPillowRecommendations() {
    const { posture, neckConcern, pillowSupport } = this.state;
    const findById = id => PILLOW_CATALOG.find(p => p.id === id);

    let ids = [4, 5]; // 기본값(바로 누움): 로얄 이모션 슬림 + 오아시스

    if (posture === "SIDE") {
      ids = [9, 8]; // 네오 컨투어 M + 네오 컴포트
      if (neckConcern === "SHOULDER_ARM" || pillowSupport === "HIGH_RESILIENCE") {
        ids = [9, 7]; // 네오 컴포트 → 로얄 에고노믹 H (어깨 결림 또는 고탄성 선호 시 더 강한 지지력으로)
      }
    } else if (posture === "PRONE_RESTLESS") {
      ids = [4, 7]; // 로얄 이모션 슬림 + 로얄 에고노믹 H
      if (pillowSupport === "HIGH_RESILIENCE") {
        ids = [9, 8]; // 탄탄한 지지 선호 시 네오 컨투어 M + 네오 컴포트로 전체 교체
      }
    } else if (neckConcern === "NECK_STIFFNESS") {
      ids = [4, 9]; // 바로 누움 + 목 뻐근함/일자목: 오아시스 → 네오 컨투어 M (목 굴곡 지지)
    }

    return ids.map(findById).filter(Boolean);
  }

  renderPillowResult() {
    this.setProgress(100);
    const results = this.getPillowRecommendations();

    const cardsHtml = results.map((item, idx) => `
      <div class="result-card">
        <span class="badge">${idx === 0 ? "추천 모델1" : "추천 모델2"}</span>
        <div class="prod-name">${item.name}</div>
        <div class="prod-image-placeholder"></div>
        <div class="prod-desc">${item.desc}</div>
        <div class="prod-specs">라인: ${item.line} | 제작 가능 사이즈: ${item.sizes.join(", ")}</div>
      </div>
    `).join("");

    this.view.innerHTML = `
      <div class="step-title">고객님을 위한 베개 추천 결과</div>
      <div class="step-desc">매장 내 체험존 위치를 확인하시고 직접 베어보며 지지감을 체감해 보세요.</div>
      <div class="result-list">${cardsHtml}</div>
      <div class="result-actions">
        <button class="option-btn kakao-btn" onclick="app.openPhoneModal()">
          <div class="option-label" style="margin:0;">카카오톡으로 결과 받기</div>
        </button>
        <button class="option-btn" style="background:var(--primary); color:#fff; border:none;" onclick="app.completeSurvey()">
          <div class="option-label" style="margin:0;">설문 완료</div>
        </button>
      </div>
    `;
  }

  openPhoneModal() {
    this.state.showPhoneModal = true;
    this.state.submitState = null;
    this.state.phone = "";
    this.renderModal();
  }

  closePhoneModal() {
    if (this.state.submitState === "loading") return;
    this.state.showPhoneModal = false;
    this.state.submitState = null;
    this.renderModal();
  }

  formatPhoneInput(event) {
    const digits = event.target.value.replace(/\D/g, "").slice(0, 11);
    let formatted = digits;
    if (digits.length > 3 && digits.length <= 7) {
      formatted = digits.slice(0, 3) + "-" + digits.slice(3);
    } else if (digits.length > 7) {
      formatted = digits.slice(0, 3) + "-" + digits.slice(3, 7) + "-" + digits.slice(7);
    }
    event.target.value = formatted;
    this.state.phone = formatted;
  }

  retryPhoneEntry() {
    this.state.submitState = null;
    this.renderModal();
  }

  renderModal() {
    const root = document.getElementById("modal-root");
    if (!this.state.showPhoneModal) { root.innerHTML = ""; return; }

    let bodyHtml;
    if (this.state.submitState === "loading") {
      bodyHtml = `
        <div class="modal-status">
          <div class="spinner"></div>
          <div>전송 중입니다...</div>
        </div>
      `;
    } else if (this.state.submitState === "success") {
      bodyHtml = `
        <div class="modal-status">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="24" cy="24" r="22" stroke="var(--primary-light)" stroke-width="2"/>
            <path d="M14 24.5L20.5 31L34 17" stroke="var(--primary-light)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <div style="font-weight:700; font-size:18px; margin-top:10px;">전송 완료</div>
          <div style="color:var(--text-sub); font-size:14px; margin-top:4px;">카카오톡으로 추천 결과를 보내드렸습니다.</div>
        </div>
        <button class="option-btn" style="text-align:center; background:var(--primary); color:#fff; border:none; margin-top:16px;" onclick="app.closePhoneModal()">
          <div class="option-label" style="margin:0;">닫기</div>
        </button>
      `;
    } else if (this.state.submitState === "error") {
      bodyHtml = `
        <div class="modal-status">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="24" cy="24" r="22" stroke="var(--error)" stroke-width="2"/>
            <path d="M24 14V27" stroke="var(--error)" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="24" cy="34" r="1.8" fill="var(--error)"/>
          </svg>
          <div style="font-weight:700; font-size:18px; margin-top:10px;">전송에 실패했습니다</div>
          <div style="color:var(--text-sub); font-size:14px; margin-top:4px;">잠시 후 다시 시도하시거나 직원에게 문의해 주세요.</div>
        </div>
        <button class="option-btn" style="text-align:center; margin-top:16px;" onclick="app.retryPhoneEntry()">
          <div class="option-label" style="margin:0;">다시 시도</div>
        </button>
      `;
    } else {
      bodyHtml = `
        <div class="step-title" style="font-size:22px; margin-bottom:8px;">전화번호를 입력해 주세요</div>
        <div class="step-desc" style="font-size:14px; margin-bottom:20px;">추천 결과를 카카오톡 메시지로 보내드립니다.</div>
        <input id="phone-input" class="phone-input" type="tel" inputmode="numeric" placeholder="010-0000-0000" maxlength="13" value="${this.state.phone}" oninput="app.formatPhoneInput(event)" />
        <div class="consent-text">입력하신 전화번호는 매트리스 추천 결과 발송 목적으로만 사용됩니다.</div>
        <div style="display:flex; gap:12px; margin-top:20px;">
          <button class="option-btn" style="flex:1; text-align:center;" onclick="app.closePhoneModal()">
            <div class="option-label" style="margin:0; font-size:16px;">취소</div>
          </button>
          <button class="option-btn kakao-btn" style="flex:1; text-align:center;" onclick="app.submitPhone()">
            <div class="option-label" style="margin:0; font-size:16px;">전송하기</div>
          </button>
        </div>
      `;
    }

    root.innerHTML = `
      <div class="modal-overlay">
        <div class="modal-box">${bodyHtml}</div>
      </div>
    `;
  }

  // 영문 코드 상태값을 설문에 표시된 한글 라벨로 변환 (구글 시트 기록용)
  toLabel(field, code) {
    if (!code) return "";
    return (LABELS[field] && LABELS[field][code]) || code;
  }

  // 매트리스/베개 설문 답변을 구글 시트 저장용 payload 형태로 변환. phone은 없으면 빈 문자열.
  // 시트에는 영문 코드가 아니라 설문에 보이는 한글 그대로 기록되도록 라벨로 변환해서 보낸다.
  buildSurveyPayload(phone) {
    return this.state.flow === "pillow"
      ? {
          timestamp: new Date().toISOString(),
          phone: phone || "",
          flow: "pillow",
          posture: this.toLabel("posture", this.state.posture),
          currentMattressFeel: this.toLabel("currentMattressFeel", this.state.currentMattressFeel),
          neckConcern: this.toLabel("neckConcern", this.state.neckConcern),
          pillowSupport: this.toLabel("pillowSupport", this.state.pillowSupport),
          recommendations: this.getPillowRecommendations().map(m => ({ name: m.name, showroom: m.showroom }))
        }
      : {
          timestamp: new Date().toISOString(),
          phone: phone || "",
          flow: "mattress",
          gender: this.toLabel("gender", this.state.gender),
          age: this.toLabel("age", this.state.age),
          size: this.toLabel("size", this.state.size),
          bodyType: this.toLabel("bodyType", this.state.bodyType),
          posture: this.toLabel("posture", this.state.posture),
          firmness: this.toLabel("firmness", this.state.firmness),
          concern: this.toLabel("concern", this.state.concern),
          recommendations: this.getRecommendations().map(m => ({ name: m.name, showroom: m.showroom }))
        };
  }

  async submitPhone() {
    const digits = (this.state.phone || "").replace(/\D/g, "");
    if (!/^01[0-9]{8,9}$/.test(digits)) {
      alert("올바른 휴대폰 번호를 입력해 주세요.");
      return;
    }

    this.state.submitState = "loading";
    this.renderModal();

    const payload = this.buildSurveyPayload(this.state.phone);
    const ok = await this.sendToBackend(payload);
    this.state.submitState = ok ? "success" : "error";
    this.renderModal();
  }

  // google-apps-script.gs 배포 URL 하나로 시트 저장 + 카카오 알림톡 발송을 함께 처리
  async sendToBackend(payload) {
    if (!CONFIG.BACKEND_URL) {
      console.warn("[설정 필요] CONFIG.BACKEND_URL이 비어 있습니다. google-apps-script.gs를 배포한 URL을 입력하세요.");
      return false;
    }
    try {
      const res = await fetch(CONFIG.BACKEND_URL, {
        method: "POST",
        // Content-Type을 지정하지 않아야 브라우저가 text/plain으로 보내 CORS 프리플라이트 없이
        // Apps Script 웹앱과 통신할 수 있습니다 (Apps Script는 OPTIONS 프리플라이트를 처리하지 못함).
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      return !!data.success;
    } catch (err) {
      console.error("백엔드 전송 실패:", err);
      return false;
    }
  }
}

const app = new KioskApp();

// 태블릿 키오스크 모드: 화면을 처음 터치하면 크롬 주소창/탭/상태바 없이 전체화면으로 전환
function enterKioskFullscreen() {
  const el = document.documentElement;
  if (!document.fullscreenElement && el.requestFullscreen) {
    el.requestFullscreen().catch(() => {});
  }
}
document.addEventListener("touchstart", enterKioskFullscreen, { once: true });
document.addEventListener("click", enterKioskFullscreen, { once: true });
</script>
</body>
</html>
