<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>던롭필로 고객 상담일지</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary-navy: #0A192F;
      --navy-card: #112240;
      --navy-light: #233554;
      --accent-gold: #C5A059;
      --accent-gold-light: #DFBF77;
      --text-white: #F8FAFC;
      --text-muted: #94A3B8;
      --input-bg: #FFFFFF;
      --input-text: #1E293B;
      --input-border: #CBD5E1;
      --input-focus: #C5A059;
      --success: #10B981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #070D18;
      color: var(--text-white);
      font-family: 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background-image: radial-gradient(circle at 50% 0%, #152E52 0%, #070D18 70%);
      background-attachment: fixed;
    }

    .app-container {
      width: 100%;
      max-width: 900px;
      background: rgba(17, 34, 64, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(197, 160, 89, 0.25);
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }

    .header {
      padding: 32px 32px 24px;
      border-bottom: 1px solid rgba(197, 160, 89, 0.2);
      text-align: center;
      background: linear-gradient(180deg, rgba(10, 25, 47, 0.8) 0%, rgba(17, 34, 64, 0.4) 100%);
    }

    .header h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #FFFFFF;
      margin: 0;
    }

    .form-content {
      padding: 32px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 28px 0 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      letter-spacing: 0.5px;
    }

    .section-title:first-child {
      margin-top: 0;
    }

    .section-title i {
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px 20px;
    }

    .col-span-2 {
      grid-column: span 2;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    label {
      font-size: 13px;
      font-weight: 500;
      color: #E2E8F0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    label .req {
      color: var(--accent-gold);
      font-size: 12px;
      margin-left: 4px;
    }

    input[type="text"],
    input[type="date"],
    input[type="time"],
    select,
    textarea {
      background-color: #FFFFFF !important;
      color: #0F172A !important;
      border: 1px solid #CBD5E1;
      border-radius: 10px;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      outline: none;
      transition: all 0.2s ease;
      width: 100%;
    }

    input::placeholder,
    textarea::placeholder {
      color: #94A3B8 !important;
      font-weight: 400;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.3);
      background-color: #FFFFFF !important;
    }

    select option {
      background-color: #FFFFFF !important;
      color: #0F172A !important;
      padding: 6px;
    }

    select optgroup {
      background-color: #F1F5F9;
      color: #334155;
      font-weight: 700;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .chips-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip-label {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      background: #FFFFFF;
      border: 1px solid #CBD5E1;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      color: #334155;
      user-select: none;
      transition: all 0.15s ease;
    }

    .chip-label:hover {
      background: #F8FAFC;
      border-color: var(--accent-gold);
    }

    .chip-label input {
      display: none;
    }

    .chip-label:has(input:checked) {
      background: #0A192F;
      border-color: var(--accent-gold);
      color: var(--accent-gold-light);
      font-weight: 600;
    }

    .segmented-control {
      display: flex;
      background: #FFFFFF;
      border: 1px solid #CBD5E1;
      border-radius: 10px;
      padding: 4px;
      gap: 4px;
    }

    .segmented-item {
      flex: 1;
      text-align: center;
    }

    .segmented-item input {
      display: none;
    }

    .segmented-item label {
      display: block;
      padding: 8px 12px;
      font-size: 13px;
      border-radius: 7px;
      cursor: pointer;
      color: #64748B;
      font-weight: 500;
      justify-content: center;
      transition: all 0.2s;
    }

    .segmented-item input:checked + label {
      background: var(--primary-navy);
      color: var(--accent-gold);
      font-weight: 700;
    }

    .submit-area {
      margin-top: 36px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .btn-submit {
      background: linear-gradient(135deg, var(--accent-gold) 0%, #A88438 100%);
      color: #0A192F;
      border: none;
      padding: 16px 48px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px -5px rgba(197, 160, 89, 0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px -5px rgba(197, 160, 89, 0.5);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .notice {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal {
      background: var(--navy-card);
      border: 1px solid var(--accent-gold);
      border-radius: 18px;
      padding: 36px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      animation: popIn 0.3s ease-out;
    }

    @keyframes popIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-icon {
      width: 64px;
      height: 64px;
      background: rgba(16, 185, 129, 0.15);
      border: 2px solid var(--success);
      color: var(--success);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 16px;
    }

    .modal h3 {
      font-size: 20px;
      margin-bottom: 8px;
      color: #FFFFFF;
    }

    .modal p {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .btn-modal {
      background: var(--accent-gold);
      color: #0A192F;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-modal-secondary {
      background: transparent;
      color: var(--accent-gold-light);
      border: 1px solid var(--accent-gold);
    }

    .btn-modal:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #pdfTemplate {
      position: fixed;
      left: -10000px;
      top: 0;
      width: 794px;
      background: #FFFFFF;
      color: #0F172A;
      font-family: 'Noto Sans KR', sans-serif;
      padding: 48px 44px;
    }

    #pdfTemplate h1 {
      font-size: 24px;
      font-weight: 700;
      color: #0A192F;
      border-bottom: 3px solid #C5A059;
      padding-bottom: 12px;
      margin-bottom: 6px;
    }

    #pdfTemplate .pdf-sub {
      font-size: 12px;
      color: #64748B;
      margin-bottom: 22px;
    }

    #pdfTemplate h2 {
      font-size: 14px;
      font-weight: 700;
      color: #A88438;
      margin: 22px 0 8px;
    }

    #pdfTemplate table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    #pdfTemplate th,
    #pdfTemplate td {
      border: 1px solid #CBD5E1;
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
      word-break: break-word;
      white-space: pre-wrap;
    }

    #pdfTemplate th {
      width: 22%;
      background: #F1F5F9;
      font-weight: 600;
      color: #334155;
    }

    @media (max-width: 680px) {
      .grid {
        grid-template-columns: 1fr;
      }
      .col-span-2 {
        grid-column: span 1;
      }
      .form-content {
        padding: 20px;
      }
      .header {
        padding: 24px 20px 18px;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="header">
      <h1>던롭필로 고객 상담일지</h1>
    </header>

    <form id="consultationForm" class="form-content">
      
      <!-- 1. 상담 기본 정보 -->
      <div class="section-title">
        <i class="fa-solid fa-calendar-check"></i>
        <span>1. 상담 기본 정보</span>
      </div>
      <div class="grid">
        <div class="form-group">
          <label>상담일자 <span class="req">*</span></label>
          <input type="date" id="consultDate" required />
        </div>
        <div class="form-group">
          <label>방문시간</label>
          <input type="time" id="visitTime" />
        </div>
        <div class="form-group">
          <label>지점명</label>
          <select id="branchName">
            <option value="">지점을 선택해주세요</option>
            <optgroup label="[직영점]">
              <option value="강남 본점">강남 본점</option>
              <option value="파주 전시장/아울렛">파주 전시장/아울렛</option>
              <option value="롯데아울렛 고양점">롯데아울렛 고양점</option>
              <option value="갤러리아백화점 타임월드점">갤러리아백화점 타임월드점</option>
              <option value="롯데몰 메종 동부산점">롯데몰 메종 동부산점</option>
            </optgroup>
          </select>
        </div>
        <div class="form-group">
          <label>상담 담당자</label>
          <input type="text" id="staff" placeholder="담당자 이름 입력" />
        </div>
        <div class="form-group col-span-2">
          <label>유입 경로</label>
          <select id="inflow">
            <option value="">선택해주세요</option>
            <option value="네이버 검색/스마트플레이스">네이버 검색 / 스마트플레이스</option>
            <option value="웨딩 카페 (다이렉트/맥마웨 등)">웨딩 제휴 카페 (다이렉트/맥마웨)</option>
            <option value="인스타그램 / SNS">공식 인스타그램 / SNS</option>
            <option value="지인 소개 및 추천">지인 소개 및 추천</option>
            <option value="쇼핑몰/로드샵 도보 유입">쇼핑몰 / 로드샵 도보 유입</option>
            <option value="기타">기타</option>
          </select>
        </div>
      </div>

      <!-- 2. 고객 프로필 -->
      <div class="section-title">
        <i class="fa-solid fa-user"></i>
        <span>2. 고객 프로필 & 수면 특성</span>
      </div>
      <div class="grid">
        <div class="form-group">
          <label>고객명 <span class="req">*</span></label>
          <input type="text" id="clientName" placeholder="예: 홍길동" required />
        </div>
        <div class="form-group">
          <label>연락처</label>
          <input type="text" id="clientPhone" placeholder="010-0000-0000" inputmode="numeric" autocomplete="tel" maxlength="13" />
        </div>
        <div class="form-group">
          <label>연령대</label>
          <select id="ageGroup">
            <option value="">선택</option>
            <option value="20대">20대</option>
            <option value="30대">30대</option>
            <option value="40대">40대</option>
            <option value="50대">50대</option>
            <option value="60대 이상">60대 이상</option>
          </select>
        </div>
        <div class="form-group">
          <label>가족 구성</label>
          <select id="family">
            <option value="">선택</option>
            <option value="신혼부부">신혼부부 (혼수)</option>
            <option value="1인 가구">1인 가구</option>
            <option value="자녀 있는 가구">자녀 있는 가구</option>
            <option value="부모 동거 가구">부모 동거 가구</option>
            <option value="기타">기타</option>
          </select>
        </div>
        <div class="form-group">
          <label>실제 사용자</label>
          <select id="userTarget">
            <option value="">선택</option>
            <option value="부부">부부 공동 사용</option>
            <option value="본인">본인 단독</option>
            <option value="자녀">자녀용</option>
            <option value="부모님">부모님 선물</option>
            <option value="기타">기타</option>
          </select>
        </div>
        <div class="form-group">
          <label>구매 목적 (유형)</label>
          <select id="purchaseType">
            <option value="">선택</option>
            <option value="신혼/혼수">신혼 / 혼수</option>
            <option value="입주/이사">신규 입주 / 이사</option>
            <option value="단순 노후 교체">기존 매트리스 노후 교체</option>
            <option value="허리/건강 목적">허리 불편 등 건강 개선</option>
            <option value="선물용">선물용</option>
          </select>
        </div>
      </div>

      <div class="form-group" style="margin-top: 16px;">
        <label>주요 수면 고민 및 체형 특성 (중복 선택 가능)</label>
        <div class="chips-group">
          <label class="chip-label"><input type="checkbox" name="sleepIssue" value="허리/요추 통증"> 허리 / 요추 통증</label>
          <label class="chip-label"><input type="checkbox" name="sleepIssue" value="목/어깨 뻐근함"> 목 / 어깨 결림</label>
          <label class="chip-label"><input type="checkbox" name="sleepIssue" value="잦은 뒤척임/숙면불가"> 잦은 뒤척임 / 얕은 수면</label>
          <label class="chip-label"><input type="checkbox" name="sleepIssue" value="열감/더위 민감"> 체온 조절 (더위/열감)</label>
          <label class="chip-label"><input type="checkbox" name="sleepIssue" value="부부 경도 취향 불일치"> 부부간 탄탄함/소프트 취향 차이</label>
          <label class="chip-label"><input type="checkbox" name="sleepIssue" value="라텍스 선호"> 100% 천연라텍스 고유 탄성 선호</label>
        </div>
      </div>

      <!-- 3. 관심 제품 및 상담 세부 내역 -->
      <div class="section-title">
        <i class="fa-solid fa-bed"></i>
        <span>3. 관심 제품 및 상담 세부 내역</span>
      </div>
      <div class="grid">
        <div class="form-group">
          <label>관심 모델 (SKU)</label>
          <select id="skuModel">
            <option value="">모델을 선택하세요</option>
            <optgroup label="[Signature 라인]">
              <option value="로얄 소버린 (Royal Sovereign)">로얄 소버린 (Royal Sovereign)</option>
              <option value="리즈 (Leeds)">리즈 (Leeds)</option>
              <option value="더비 (Derby)">더비 (Derby)</option>
              <option value="이모션 (Emocion - 전동용)">이모션 (Emocion)</option>
              <option value="트라이엄프 (Triumph)">트라이엄프 (Triumph)</option>
              <option value="플래티넘 (Platinum)">플래티넘 (Platinum)</option>
              <option value="인피니트 (Infinite)">인피니트 (Infinite)</option>
              <option value="오키드 V2 (Orchid V2)">오키드 V2 (Orchid V2)</option>
            </optgroup>
            <optgroup label="[Moments 라인]">
              <option value="누베 (Nube)">누베 (Nube)</option>
              <option value="필리 M/F (Filey)">필리 M / Filey F</option>
              <option value="베네토 FM">베네토 FM</option>
              <option value="헤리트 19">헤리트 19</option>
              <option value="헤리트 21">헤리트 21</option>
              <option value="로얄블루 360/330">로얄블루 360 / 330</option>
              <option value="뷰티 (Beauty)">뷰티 (Beauty)</option>
              <option value="펌레스트 (Firmrest)">펌레스트 (Firmrest)</option>
              <option value="닥터슬립 L (Dr. Sleep L)">닥터슬립 L (Dr. Sleep L)</option>
              <option value="기타 모델">기타 / 프레임 전용</option>
            </optgroup>
          </select>
        </div>

        <div class="form-group">
          <label>전체 예산대</label>
          <select id="budget">
            <option value="">예산 선택</option>
            <option value="100~200만원대">100만원 ~ 200만원대</option>
            <option value="200~300만원대">200만원 ~ 300만원대</option>
            <option value="300~500만원대">300만원 ~ 500만원대</option>
            <option value="500~700만원대">500만원 ~ 700만원대</option>
            <option value="700~1,000만원대">700만원 ~ 1,000만원대</option>
            <option value="1,000만원 이상">1,000만원 이상 (하이엔드)</option>
          </select>
        </div>

        <div class="form-group">
          <label>프레임 희망여부</label>
          <div class="segmented-control">
            <div class="segmented-item">
              <input type="radio" id="motorYes" name="motorUsage" value="모션베드" />
              <label for="motorYes">모션베드</label>
            </div>
            <div class="segmented-item">
              <input type="radio" id="motorNo" name="motorUsage" value="일반베드" checked />
              <label for="motorNo">일반베드</label>
            </div>
            <div class="segmented-item">
              <input type="radio" id="motorUndecided" name="motorUsage" value="미정" />
              <label for="motorUndecided">미정</label>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>적용 프로모션</label>
          <input type="text" id="promotion" placeholder="예: 웨딩 제휴 10% 등" />
        </div>

        <div class="form-group col-span-2">
          <label>사은품</label>
          <input type="text" id="giftItem" placeholder="제공 사은품 내역 (예: 라텍스 베개 2EA, 방수 커버, 바디필로우 등)" />
        </div>

        <div class="form-group">
          <label>견적가 (원)</label>
          <input type="text" id="quotePrice" placeholder="예: 3,500,000" inputmode="numeric" />
        </div>

        <div class="form-group">
          <label>계약가 (원)</label>
          <input type="text" id="contractPrice" placeholder="실제 결제/계약 금액" inputmode="numeric" />
        </div>

        <div class="form-group">
          <label>계약 여부</label>
          <div class="segmented-control">
            <div class="segmented-item">
              <input type="radio" id="contractStatusNo" name="contractStatus" value="N" checked />
              <label for="contractStatusNo">계약 안함</label>
            </div>
            <div class="segmented-item">
              <input type="radio" id="contractStatusYes" name="contractStatus" value="Y" />
              <label for="contractStatusYes">계약 완료</label>
            </div>
          </div>
        </div>

        <div class="form-group col-span-2">
          <label>상담 비고 및 특이사항</label>
          <textarea id="notes" placeholder="고객 반응, 체감 경도 선호도, 배송 희망일, 다음 팔로업 일정 등을 입력하세요."></textarea>
        </div>
      </div>

      <!-- 제출 버튼 -->
      <div class="submit-area">
        <button type="submit" class="btn-submit" id="submitBtn">
          <i class="fa-solid fa-check"></i>
          <span>상담 일지 등록 완료</span>
        </button>
        <p class="notice">던롭필로 본사 마스터 시트(고객 상담일지)에 실시간 안전하게 저장됩니다.</p>
      </div>

    </form>
  </div>

  <!-- 완료 모달 -->
  <div class="modal-overlay" id="successModal">
    <div class="modal">
      <div class="modal-icon">
        <i class="fa-solid fa-check"></i>
      </div>
      <h3>상담 일지가 등록되었습니다</h3>
      <p id="modalDesc">고객 상담 정보가 정상적으로 등록되었습니다.</p>
      <div class="modal-actions">
        <button class="btn-modal btn-modal-secondary" id="pdfBtn" onclick="savePdf()">
          <i class="fa-solid fa-file-pdf"></i> PDF로 저장하기
        </button>
        <button class="btn-modal" onclick="resetForm()">새 상담 작성하기</button>
      </div>
    </div>
  </div>

  <!-- PDF 출력용 템플릿 (화면 밖에 숨김) -->
  <div id="pdfTemplate"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwufq-rK8NJvNMb5ix07LyH84Rzoo1KhsehnrHWGe6xooEXOFpw2fscTnC8q0B1O3Y/exec";

    function setDefaultTime() {
      const now = new Date();
      document.getElementById('consultDate').value = now.toISOString().split('T')[0];
      // 방문시간 초기 세팅: 오후 02:00 (14:00)
      document.getElementById('visitTime').value = "14:00";
    }

    document.addEventListener("DOMContentLoaded", () => {
      setDefaultTime();
    });

    document.getElementById('consultationForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      const originalText = submitBtn.innerHTML;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>시트에 저장 중...</span>';
      submitBtn.disabled = true;

      const selectedIssues = Array.from(document.querySelectorAll('input[name="sleepIssue"]:checked'))
        .map(el => el.value)
        .join(', ');

      const formData = {
        date: document.getElementById('consultDate').value,
        time: document.getElementById('visitTime').value,
        branch: document.getElementById('branchName').value,
        client: document.getElementById('clientName').value,
        phone: document.getElementById('clientPhone').value,
        age: document.getElementById('ageGroup').value,
        family: document.getElementById('family').value,
        issues: selectedIssues,
        inflow: document.getElementById('inflow').value,
        purchaseType: document.getElementById('purchaseType').value,
        budget: document.getElementById('budget').value,
        model: document.getElementById('skuModel').value,
        target: document.getElementById('userTarget').value,
        motor: document.querySelector('input[name="motorUsage"]:checked')?.value || '',
        gift: document.getElementById('giftItem').value,
        quote: document.getElementById('quotePrice').value,
        contract: document.getElementById('contractPrice').value,
        contractStatus: document.querySelector('input[name="contractStatus"]:checked')?.value || 'N',
        promotion: document.getElementById('promotion').value,
        staff: document.getElementById('staff').value,
        notes: document.getElementById('notes').value
      };

      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain"
        },
        body: JSON.stringify(formData)
      })
      .then(() => {
        lastFormData = formData;
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
        document.getElementById('modalDesc').innerText = `${formData.client} 고객님의 상담 일지가 마스터 시트에 성공적으로 등록되었습니다.`;
        document.getElementById('successModal').style.display = 'flex';
      })
      .catch((error) => {
        alert("전송 중 오류가 발생했습니다: " + error);
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
      });
    });

    function resetForm() {
      document.getElementById('successModal').style.display = 'none';
      document.getElementById('consultationForm').reset();
      setDefaultTime();
    }

    let lastFormData = null;

    document.getElementById('clientPhone').addEventListener('input', function() {
      const d = this.value.replace(/\D/g, '').slice(0, 11);
      if (d.length <= 3) this.value = d;
      else if (d.length <= 7) this.value = d.slice(0, 3) + '-' + d.slice(3);
      else this.value = d.slice(0, 3) + '-' + d.slice(3, 7) + '-' + d.slice(7);
    });

    ['quotePrice', 'contractPrice'].forEach(id => {
      document.getElementById(id).addEventListener('input', function() {
        const d = this.value.replace(/\D/g, '');
        this.value = d ? Number(d).toLocaleString('en-US') : '';
      });
    });

    function buildPdfTemplate(d) {
      const root = document.getElementById('pdfTemplate');
      root.textContent = '';

      const el = (tag, text, cls) => {
        const n = document.createElement(tag);
        if (text !== undefined) n.textContent = text;
        if (cls) n.className = cls;
        return n;
      };

      const section = (title, rows) => {
        if (title) root.appendChild(el('h2', title));
        const table = el('table');
        rows.forEach(([label, value]) => {
          const tr = el('tr');
          tr.appendChild(el('th', label));
          const td = el('td', value && String(value).trim() ? value : '-');
          td.colSpan = 3;
          tr.appendChild(td);
          table.appendChild(tr);
        });
        root.appendChild(table);
      };

      const pairSection = (title, pairs) => {
        root.appendChild(el('h2', title));
        const table = el('table');
        for (let i = 0; i < pairs.length; i += 2) {
          const tr = el('tr');
          [pairs[i], pairs[i + 1]].forEach(pair => {
            if (pair && pair[0]) {
              tr.appendChild(el('th', pair[0]));
              tr.appendChild(el('td', pair[1] && String(pair[1]).trim() ? pair[1] : '-'));
            } else {
              tr.appendChild(el('th', ''));
              tr.appendChild(el('td', ''));
            }
          });
          table.appendChild(tr);
        }
        root.appendChild(table);
      };

      const won = v => (v && String(v).trim() ? `${v} 원` : '');

      root.appendChild(el('h1', '던롭필로 고객 상담일지'));
      root.appendChild(el('p', `출력일시: ${new Date().toLocaleString('ko-KR')}`, 'pdf-sub'));

      pairSection('1. 상담 기본 정보', [
        ['상담일자', d.date], ['방문시간', d.time],
        ['지점명', d.branch], ['상담 담당자', d.staff],
        ['유입 경로', d.inflow], ['', '']
      ]);

      pairSection('2. 고객 프로필 & 수면 특성', [
        ['고객명', d.client], ['연락처', d.phone],
        ['연령대', d.age], ['가족 구성', d.family],
        ['실제 사용자', d.target], ['구매 목적', d.purchaseType]
      ]);
      section('', [['수면 고민', d.issues]]);

      pairSection('3. 관심 제품 및 상담 세부 내역', [
        ['관심 모델', d.model], ['전체 예산대', d.budget],
        ['프레임 희망여부', d.motor], ['적용 프로모션', d.promotion],
        ['견적가', won(d.quote)], ['계약가', won(d.contract)],
        ['계약 여부', d.contractStatus === 'Y' ? '계약 완료' : '계약 안함'], ['', '']
      ]);
      section('', [['사은품', d.gift], ['상담 비고', d.notes]]);
    }

    async function savePdf() {
      if (!lastFormData) return;
      if (typeof html2canvas === 'undefined' || !window.jspdf) {
        alert('PDF 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인한 후 다시 시도해주세요.');
        return;
      }

      const btn = document.getElementById('pdfBtn');
      const original = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> PDF 생성 중...';

      try {
        buildPdfTemplate(lastFormData);
        if (document.fonts && document.fonts.ready) await document.fonts.ready;

        const target = document.getElementById('pdfTemplate');
        const canvas = await html2canvas(target, { scale: 2, backgroundColor: '#FFFFFF', useCORS: true });

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });
        const pageW = pdf.internal.pageSize.getWidth();
        const pageH = pdf.internal.pageSize.getHeight();
        const imgH = (canvas.height * pageW) / canvas.width;

        if (imgH <= pageH) {
          pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, pageW, imgH);
        } else {
          const pxPerPage = Math.floor((canvas.width * pageH) / pageW);
          let offset = 0;
          let first = true;
          while (offset < canvas.height) {
            const sliceH = Math.min(pxPerPage, canvas.height - offset);
            const slice = document.createElement('canvas');
            slice.width = canvas.width;
            slice.height = sliceH;
            const ctx = slice.getContext('2d');
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, slice.width, slice.height);
            ctx.drawImage(canvas, 0, offset, canvas.width, sliceH, 0, 0, canvas.width, sliceH);
            if (!first) pdf.addPage();
            pdf.addImage(slice.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, pageW, (sliceH * pageW) / canvas.width);
            offset += sliceH;
            first = false;
          }
        }

        const safe = s => String(s || '').replace(/[\\/:*?"<>|]/g, '').trim();
        pdf.save(`상담일지_${safe(lastFormData.client) || '고객'}_${lastFormData.date || ''}.pdf`);
      } catch (err) {
        alert('PDF 저장 중 오류가 발생했습니다: ' + err);
      } finally {
        btn.disabled = false;
        btn.innerHTML = original;
      }
    }
  </script>
</body>
</html>
